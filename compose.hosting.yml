services:
  app:
    volumes:
      - www:/www
      - hostkonfig:/hostkonfig
      - hostlogs:/hostlogs:ro
    environment:
      RC_HOSTING: "1"
      RC_PHPDB_ROOT_PASSWORD: ${PHPDB_ROOT_PASSWORD:?PHPDB_ROOT_PASSWORD fehlt in der .env}
      RC_PHP_VERSION: ${RC_PHP_VERSION:-8.3}
    networks: [default, hosting]

  web: &web
    image: ghcr.io/theredstonee/redclub-php:${RC_PHP_VERSION:-8.3}
    restart: unless-stopped
    environment:
      RC_STANDARD: "1"
      RC_PHP_TAG: ${RC_PHP_VERSION:-8.3}
    volumes:
      - www:/www
      - hostkonfig:/konfig:ro
      - hostlogs:/logs
    networks: [hosting]
    expose: ["80"]
    depends_on:
      phpdb:
        condition: service_healthy
    stop_grace_period: 10s

  web82:
    <<: *web
    image: ghcr.io/theredstonee/redclub-php:8.2
    environment: { RC_STANDARD: "0", RC_PHP_TAG: "8.2" }
    profiles: [php82]
  web83:
    <<: *web
    image: ghcr.io/theredstonee/redclub-php:8.3
    environment: { RC_STANDARD: "0", RC_PHP_TAG: "8.3" }
    profiles: [php83]
  web84:
    <<: *web
    image: ghcr.io/theredstonee/redclub-php:8.4
    environment: { RC_STANDARD: "0", RC_PHP_TAG: "8.4" }
    profiles: [php84]
  web85:
    <<: *web
    image: ghcr.io/theredstonee/redclub-php:8.5
    environment: { RC_STANDARD: "0", RC_PHP_TAG: "8.5" }
    profiles: [php85]

  phpdb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${PHPDB_ROOT_PASSWORD:?PHPDB_ROOT_PASSWORD fehlt in der .env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - phpdb:/var/lib/mysql
    networks: [hosting]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  hosting: {}

volumes:
  www: {}
  hostkonfig: {}
  hostlogs: {}
  phpdb: {}
