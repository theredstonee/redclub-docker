# RedClub — By TheRedStonee · https://www.theredstonee.de
#
# Start:   docker compose up -d
# Danach:  die Adresse aus der Installation im Browser oeffnen und dem Assistenten folgen.
# Den Setup-Code zeigt:  docker compose logs app | grep Setup-Code
#
# Diese Datei enthaelt nur App und Datenbank. Wie RedClub nach aussen kommt, legt COMPOSE_FILE
# in der .env fest (install.sh setzt das automatisch):
#   docker-compose.yml:compose.caddy.yml   eigener Caddy auf Port 80/443 mit automatischem HTTPS
#   docker-compose.yml:compose.port.yml    nur ein Port auf 127.0.0.1 hinter deinem nginx/Apache
#
# Vereinsdaten liegen in der Datenbank (Volume "db"), Belege und Dokumente im Volume "daten" (im Container /data).
#
# Cloudflare Tunnel (optional): cloudflared laeuft nur mit dem Profil "tunnel" — eingeschaltet im Panel unter
# Einstellungen → Installation (setzt RC_TUNNEL_TOKEN + COMPOSE_PROFILES ueber den Update-Dienst).
services:
  app:
    image: ghcr.io/theredstonee/redclub:latest
    restart: unless-stopped
    environment:
      NUXT_DB_URL: postgres://redclub:${DB_PASSWORD:?Bitte DB_PASSWORD in .env setzen}@db:5432/redclub
      TZ: ${TZ:-Europe/Berlin}
      # Notausgang bei verlorener Zwei-Faktor-Anmeldung, siehe README (normalerweise leer).
      RC_RESET_2FA: ${RC_RESET_2FA:-}
      # Sprache bis zur Einrichtung (de|en) — fragt install.sh ab; danach gilt die Einstellung im Panel
      RC_LANG: ${RC_LANG:-de}
      # Cloudflare Tunnel: Status-Abfrage beim cloudflared-Container (Dienst "cloudflared" unten)
      RC_TUNNEL_METRICS: ${RC_TUNNEL_METRICS:-cloudflared:2000}
    volumes:
      - daten:/data
    depends_on:
      db:
        condition: service_healthy
    # Nicht direkt nach aussen geoeffnet — erreichbar nur ueber Caddy oder den Port aus compose.port.yml.
    expose: ["3000"]
    stop_grace_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: redclub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: redclub
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redclub -d redclub"]
      interval: 5s
      timeout: 3s
      retries: 20

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    # Ziel im Cloudflare-Dashboard: http://app:3000 (die App in diesem Compose-Netz)
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${RC_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  db:
  daten:
