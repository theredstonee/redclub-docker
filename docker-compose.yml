services:
  app:
    image: ghcr.io/theredstonee/redclub:latest
    restart: unless-stopped
    environment:
      NUXT_DB_URL: postgres://redclub:${DB_PASSWORD:?Bitte DB_PASSWORD in .env setzen}@db:5432/redclub
      TZ: ${TZ:-Europe/Berlin}
      RC_RESET_2FA: ${RC_RESET_2FA:-}
      RC_LANG: ${RC_LANG:-de}
      RC_TUNNEL_METRICS: ${RC_TUNNEL_METRICS:-cloudflared:2000}
    volumes:
      - daten:/data
    depends_on:
      db:
        condition: service_healthy
    expose: ["3000"]
    stop_grace_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: redclub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: redclub
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redclub -d redclub"]
      interval: 5s
      timeout: 3s
      retries: 20

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${RC_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  db:
  daten:
